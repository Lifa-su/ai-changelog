<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Changelog Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f13;--surface:#1a1a24;--surface2:#242436;--border:#2e2e44;
  --text:#e4e4ef;--text2:#9494b8;--accent:#6c5ce7;--accent2:#a29bfe;
  --green:#00b894;--orange:#fdcb6e;--red:#e17055;--blue:#74b9ff;
  --radius:12px;--shadow:0 4px 24px rgba(0,0,0,.3);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
a{color:var(--accent2);text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:20px}
header{text-align:center;padding:40px 0 30px;position:relative}
header h1{font-size:2rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline-flex;align-items:center;gap:12px}
header p{color:var(--text2);margin-top:8px;font-size:.95rem}
.badge{display:inline-block;background:var(--surface2);color:var(--accent2);font-size:.7rem;padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:middle}

/* Layout */
.main-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}
@media(max-width:900px){.main-grid{grid-template-columns:1fr}}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.card-title{font-size:1.1rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:1.3rem}

/* Form elements */
textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:14px;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:.85rem;resize:vertical;line-height:1.5;transition:border-color .2s}
textarea:focus{outline:none;border-color:var(--accent)}
.input-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.input-group{flex:1;min-width:140px}
.input-group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:6px;font-weight:500}
select,input[type=text]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-size:.9rem;transition:border-color .2s}
select:focus,input:focus{outline:none;border-color:var(--accent)}

/* Buttons */
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#7c6cf0);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(108,92,231,.4)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.8rem}
.btn-danger{background:var(--red);color:#fff}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* API Key */
.api-bar{display:flex;gap:12px;align-items:end;margin-bottom:20px;flex-wrap:wrap}
.api-bar .input-group{flex:1;min-width:250px}
.api-bar input[type=text]{font-family:monospace}
.api-status{font-size:.75rem;padding:4px 10px;border-radius:20px;white-space:nowrap;align-self:center}
.api-status.ok{background:rgba(0,184,148,.15);color:var(--green)}
.api-status.no{background:rgba(225,112,85,.15);color:var(--red)}

/* Output */
.output-area{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:16px;min-height:200px;max-height:600px;overflow-y:auto;font-size:.9rem;white-space:pre-wrap;word-break:break-word;line-height:1.7}
.output-area:empty::before{content:'生成的 Changelog 将显示在这里...';color:var(--text2);font-style:italic}
.output-area h2{color:var(--accent2);margin:16px 0 8px;font-size:1.1rem}
.output-area h3{color:var(--green);margin:12px 0 6px;font-size:.95rem}
.output-area ul{padding-left:20px;margin:4px 0}
.output-area li{margin:2px 0}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{padding:8px 16px;font-size:.85rem;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-weight:500}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
.tab-content{display:none}
.tab-content.active{display:block}

/* Version History */
.history-list{max-height:400px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;transition:background .2s;cursor:pointer}
.history-item:hover{background:var(--surface2)}
.history-item .ver{font-weight:600;color:var(--accent2)}
.history-item .date{font-size:.8rem;color:var(--text2)}
.history-item .actions{display:flex;gap:6px}
.history-empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}

/* Loading */
.loading{display:none;align-items:center;gap:10px;padding:16px;color:var(--text2)}
.loading.show{display:flex}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;box-shadow:var(--shadow);transform:translateY(100px);opacity:0;transition:all .3s;z-index:999;font-size:.9rem}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}

/* Semver badges */
.semver-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.semver-major{background:rgba(225,112,85,.2);color:var(--red)}
.semver-minor{background:rgba(253,203,110,.2);color:var(--orange)}
.semver-patch{background:rgba(0,184,148,.2);color:var(--green)}

/* Markdown raw */
.md-raw{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:.82rem;white-space:pre;line-height:1.5;color:var(--text2)}

/* Release notes */
.release-notes{line-height:1.8;font-size:.95rem}
.release-notes h3{color:var(--accent2);margin:12px 0 6px}
.release-notes ul{padding-left:20px}
.release-notes li{margin:4px 0}

/* Responsive */
@media(max-width:600px){
  .container{padding:12px}
  header h1{font-size:1.5rem}
  .card{padding:16px}
  .input-row{flex-direction:column}
  .api-bar{flex-direction:column}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📋 AI Changelog Generator <span class="badge">MVP</span></h1>
    <p>粘贴 Git Log → AI 生成结构化更新日志 | Powered by DeepSeek</p>
  </header>

  <!-- API Key Bar -->
  <div class="api-bar">
    <div class="input-group">
      <label>DeepSeek API Key</label>
      <input type="text" id="apiKey" placeholder="sk-..." autocomplete="off">
    </div>
    <span id="apiStatus" class="api-status no">未配置</span>
    <button class="btn btn-secondary btn-sm" onclick="saveApiKey()">保存</button>
  </div>

  <div class="main-grid">
    <!-- Left: Input -->
    <div class="card">
      <div class="card-title"><span class="icon">📝</span> 输入</div>
      <textarea id="commitInput" rows="12" placeholder="粘贴 git log 输出或 commit 列表，例如：

feat: add user authentication module
fix: resolve memory leak in data processing
docs: update API documentation
refactor: simplify database connection logic
feat!: redesign dashboard layout (breaking change)
chore: update dependencies
fix: correct timezone handling in reports
feat: add export to PDF feature
deprecate: legacy API v1 endpoints
security: patch XSS vulnerability in comments"></textarea>

      <div class="input-row" style="margin-top:14px">
        <div class="input-group">
          <label>当前版本号</label>
          <input type="text" id="currentVersion" placeholder="例如 1.2.3" value="">
        </div>
        <div class="input-group">
          <label>输出语言</label>
          <select id="outputLang">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="both">中英双语</option>
          </select>
        </div>
        <div class="input-group">
          <label>项目名称（可选）</label>
          <input type="text" id="projectName" placeholder="My Project">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="generateBtn" onclick="generate()">
          ✨ 生成 Changelog
        </button>
        <button class="btn btn-secondary" onclick="generateReleaseNotes()">
          📢 生成发布说明
        </button>
        <button class="btn btn-secondary" onclick="clearInput()">清空</button>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <span id="loadingText">AI 正在分析 commits...</span>
      </div>
    </div>

    <!-- Right: Output -->
    <div class="card">
      <div class="card-title"><span class="icon">📄</span> 输出</div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('preview')">预览</button>
        <button class="tab" onclick="switchTab('markdown')">Markdown</button>
        <button class="tab" onclick="switchTab('release')">发布说明</button>
      </div>

      <div id="tab-preview" class="tab-content active">
        <div class="output-area" id="previewOutput"></div>
      </div>
      <div id="tab-markdown" class="tab-content">
        <div class="output-area md-raw" id="markdownOutput"></div>
      </div>
      <div id="tab-release" class="tab-content">
        <div class="output-area release-notes" id="releaseOutput"></div>
      </div>

      <div class="btn-group">
        <button class="btn btn-secondary btn-sm" onclick="copyMarkdown()">📋 复制 Markdown</button>
        <button class="btn btn-secondary btn-sm" onclick="exportFile()">💾 导出文件</button>
        <button class="btn btn-secondary btn-sm" onclick="saveToHistory()">📌 保存到历史</button>
      </div>
    </div>
  </div>

  <!-- History -->
  <div class="card" style="margin-top:24px">
    <div class="card-title"><span class="icon">🕐</span> 历史版本</div>
    <div id="historyList" class="history-list">
      <div class="history-empty">暂无历史记录，生成 Changelog 后可保存到这里</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== State =====
let state = {
  markdown: '',
  releaseNotes: '',
  html: '',
  history: JSON.parse(localStorage.getItem('changelog_history') || '[]'),
  apiKey: localStorage.getItem('deepseek_api_key') || ''
};

// ===== Init =====
document.addEventListener('DOMContentLoaded', () => {
  if (state.apiKey) {
    document.getElementById('apiKey').value = state.apiKey;
    updateApiStatus(true);
  }
  renderHistory();
});

// ===== API Key =====
function saveApiKey() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { toast('请输入 API Key', 'error'); return; }
  state.apiKey = key;
  localStorage.setItem('deepseek_api_key', key);
  updateApiStatus(true);
  toast('API Key 已保存', 'success');
}

function updateApiStatus(ok) {
  const el = document.getElementById('apiStatus');
  el.className = 'api-status ' + (ok ? 'ok' : 'no');
  el.textContent = ok ? '已配置 ✓' : '未配置';
}

// ===== DeepSeek API =====
async function callDeepSeek(systemPrompt, userPrompt) {
  if (!state.apiKey) throw new Error('请先配置 DeepSeek API Key');

  const res = await fetch('https://api.deepseek.com/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${state.apiKey}`
    },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userPrompt }
      ],
      temperature: 0.3,
      max_tokens: 4096
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `API 错误: ${res.status}`);
  }

  const data = await res.json();
  return data.choices[0].message.content;
}

// ===== Generate Changelog =====
async function generate() {
  const commits = document.getElementById('commitInput').value.trim();
  if (!commits) { toast('请输入 commit 列表', 'error'); return; }

  const lang = document.getElementById('outputLang').value;
  const version = document.getElementById('currentVersion').value.trim();
  const project = document.getElementById('projectName').value.trim();

  const langInstr = {
    zh: '用中文输出。',
    en: 'Output in English.',
    both: '同时输出中文和英文版本，先中文后英文，用 --- 分隔。'
  }[lang];

  const systemPrompt = `你是一个专业的 Changelog 生成器。严格遵循 Keep a Changelog (https://keepachangelog.com) 格式。

规则：
1. 分析每条 commit，归类到以下类别：Added, Changed, Deprecated, Removed, Fixed, Security
2. 合并相似的 commit，用清晰简洁的语言重写
3. 根据变更内容建议语义化版本号（semver）：
   - MAJOR: 有破坏性变更（breaking changes）
   - MINOR: 新增功能（features）
   - PATCH: 修复 bug、文档更新等
4. ${langInstr}
5. 只输出 Markdown 格式的 changelog，不要额外解释

格式示例：
# Changelog

## [版本号] - 日期

### Added
- 新增的功能

### Changed
- 变更的功能

### Fixed
- 修复的问题`;

  let userMsg = `请分析以下 commits 并生成 changelog：\n\n${commits}`;
  if (version) userMsg += `\n\n当前版本号: ${version}（请基于此建议新版本号）`;
  if (project) userMsg += `\n项目名称: ${project}`;

  setLoading(true, 'AI 正在分析 commits...');
  try {
    const md = await callDeepSeek(systemPrompt, userMsg);
    state.markdown = md;
    state.html = markdownToHtml(md);
    document.getElementById('previewOutput').innerHTML = state.html;
    document.getElementById('markdownOutput').textContent = md;
    switchTab('preview');
    toast('Changelog 生成成功！', 'success');
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    setLoading(false);
  }
}

// ===== Generate Release Notes =====
async function generateReleaseNotes() {
  const commits = document.getElementById('commitInput').value.trim();
  if (!commits && !state.markdown) { toast('请先输入 commits 或生成 changelog', 'error'); return; }

  const lang = document.getElementById('outputLang').value;
  const project = document.getElementById('projectName').value.trim() || '本项目';

  const langInstr = {
    zh: '用中文输出。',
    en: 'Output in English.',
    both: '同时输出中文和英文版本，先中文后英文，用 --- 分隔。'
  }[lang];

  const systemPrompt = `你是一个产品经理，擅长将技术变更转化为用户友好的发布说明。

规则：
1. 面向非技术用户，避免技术术语
2. 突出用户能感知到的改进和新功能
3. 用积极正面的语气
4. 简洁明了，使用 emoji 增加可读性
5. ${langInstr}
6. 输出 Markdown 格式`;

  const source = state.markdown || commits;
  const userMsg = `请将以下技术变更转化为用户友好的发布说明：\n\n项目：${project}\n\n${source}`;

  setLoading(true, 'AI 正在生成发布说明...');
  try {
    const notes = await callDeepSeek(systemPrompt, userMsg);
    state.releaseNotes = notes;
    document.getElementById('releaseOutput').innerHTML = markdownToHtml(notes);
    switchTab('release');
    toast('发布说明生成成功！', 'success');
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    setLoading(false);
  }
}

// ===== Simple Markdown to HTML =====
function markdownToHtml(md) {
  if (!md) return '';
  let html = md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // Headers
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1 style="font-size:1.3rem;color:var(--accent2)">$1</h1>')
    // Bold & italic
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // Code
    .replace(/`(.+?)`/g, '<code style="background:var(--surface);padding:1px 5px;border-radius:3px;font-size:.85em">$1</code>')
    // List items
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    // Horizontal rule
    .replace(/^---$/gm, '<hr style="border:none;border-top:1px solid var(--border);margin:16px 0">')
    // Line breaks
    .replace(/\n/g, '\n');

  // Wrap consecutive <li> in <ul>
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  // Paragraphs for remaining text
  html = html.replace(/^(?!<[hul1-9lr])((?!<).+)$/gm, '<p>$1</p>');

  return html;
}

// ===== Tabs =====
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab-content#tab-${name}`).classList.add('active');
  // Find tab button by text mapping
  const map = { preview: '预览', markdown: 'Markdown', release: '发布说明' };
  document.querySelectorAll('.tab').forEach(t => {
    if (t.textContent.trim() === map[name]) t.classList.add('active');
  });
}

// ===== History =====
function saveToHistory() {
  if (!state.markdown) { toast('没有可保存的内容', 'error'); return; }

  const versionMatch = state.markdown.match(/##\s*\[([^\]]+)\]/);
  const version = versionMatch ? versionMatch[1] : document.getElementById('currentVersion').value || 'Unknown';
  const project = document.getElementById('projectName').value.trim() || 'Untitled';

  const entry = {
    id: Date.now(),
    version,
    project,
    date: new Date().toISOString().split('T')[0],
    markdown: state.markdown,
    releaseNotes: state.releaseNotes,
    html: state.html
  };

  state.history.unshift(entry);
  if (state.history.length > 50) state.history.pop();
  localStorage.setItem('changelog_history', JSON.stringify(state.history));
  renderHistory();
  toast('已保存到历史记录', 'success');
}

function renderHistory() {
  const el = document.getElementById('historyList');
  if (!state.history.length) {
    el.innerHTML = '<div class="history-empty">暂无历史记录，生成 Changelog 后可保存到这里</div>';
    return;
  }
  el.innerHTML = state.history.map(h => `
    <div class="history-item" onclick="loadHistory(${h.id})">
      <div>
        <span class="ver">${esc(h.project)} v${esc(h.version)}</span>
        <span class="date">${h.date}</span>
      </div>
      <div class="actions">
        <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();loadHistory(${h.id})">加载</button>
        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteHistory(${h.id})">删除</button>
      </div>
    </div>
  `).join('');
}

function loadHistory(id) {
  const entry = state.history.find(h => h.id === id);
  if (!entry) return;
  state.markdown = entry.markdown;
  state.html = entry.html || markdownToHtml(entry.markdown);
  state.releaseNotes = entry.releaseNotes || '';
  document.getElementById('previewOutput').innerHTML = state.html;
  document.getElementById('markdownOutput').textContent = state.markdown;
  document.getElementById('releaseOutput').innerHTML = markdownToHtml(state.releaseNotes);
  toast(`已加载 ${entry.project} v${entry.version}`, 'success');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteHistory(id) {
  state.history = state.history.filter(h => h.id !== id);
  localStorage.setItem('changelog_history', JSON.stringify(state.history));
  renderHistory();
  toast('已删除', 'success');
}

// ===== Export =====
function copyMarkdown() {
  if (!state.markdown) { toast('没有可复制的内容', 'error'); return; }
  navigator.clipboard.writeText(state.markdown).then(() => toast('已复制到剪贴板', 'success'));
}

function exportFile() {
  if (!state.markdown) { toast('没有可导出的内容', 'error'); return; }
  const blob = new Blob([state.markdown], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const project = document.getElementById('projectName').value.trim() || 'CHANGELOG';
  a.download = `${project}-changelog.md`;
  a.click();
  URL.revokeObjectURL(url);
  toast('文件已下载', 'success');
}

// ===== Utilities =====
function setLoading(show, text) {
  const el = document.getElementById('loading');
  el.classList.toggle('show', show);
  if (text) document.getElementById('loadingText').textContent = text;
  document.getElementById('generateBtn').disabled = show;
}

function clearInput() {
  document.getElementById('commitInput').value = '';
  document.getElementById('currentVersion').value = '';
  document.getElementById('projectName').value = '';
}

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3000);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
